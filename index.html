<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Meeting Login</title>
    <!-- Font Awesome untuk ikon mata pada password -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        display: flex;
        /* align-items: center;
            justify-content: center; */
        min-height: 100vh;
        background-color: #f3f4f6;
        overflow: hidden;
        position: relative;
      }

      .background {
        position: fixed;
        inset: 0;
        background-image: url("assets/meeting-room.png");
        background-size: cover;
        background-position: center;
        z-index: -1;
      }
      /*
        .background::before {
            content: '';
            position: absolute;
            inset: 0;
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px); 
        }
			*/
      .login-box {
        position: relative;
        background-color: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        /*max-width: 448px; */
        max-width: 448px;
        width: 100%;
        height: 480px;
        /*margin: 0 1rem; */
        margin-top: 190px;
        margin-left: 120px;
        box-sizing: border-box;
      }

      .logo-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }

      .logo {
        background-color: #ff7f3e;
        color: white;
        font-size: 20px;
        font-weight: bold;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        margin-right: 12px;
      }

      .logo-text {
        font-size: 20px;
        font-weight: 600;
        color: #ff7f3e;
      }

      .title {
        font-size: 1.5rem;
        font-weight: bold;
        color: #1f2937;
        text-align: center;
        margin-bottom: 8px;
      }

      .subtitle {
        font-size: 14px;
        color: #6b7280;
        text-align: center;
        margin-bottom: 32px;
      }

      .input-group {
        margin-bottom: 16px;
        position: relative;
      }

      .input-field {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 1rem;
        transition: border-color 0.2s ease-in-out;
        box-sizing: border-box;
      }

      .input-field:focus {
        outline: none;
        border-color: #ff7f3e;
      }

      .password-toggle {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        color: #9ca3af;
        transition: color 0.2s ease-in-out;
      }

      .password-toggle:hover {
        color: #4b5563;
      }

      .forgot-password {
        display: block;
        text-align: right;
        font-size: 0.875rem;
        font-weight: 500;
        color: #ff7f3e;
        text-decoration: none;
        margin-bottom: 24px;
      }

      .login-button {
        width: 100%;
        padding: 12px;
        background-color: #ff7f3e;
        color: white;
        font-size: 1.125rem;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease-in-out;
      }

      .login-button:hover {
        background-color: #e66f33;
      }
    </style>
  </head>
  <body>
    <!-- Kontainer Latar Belakang -->
    <div class="background"></div>

    <!-- Kotak Login -->
    <div class="login-box">
      <div class="logo-container">
        <div class="logo">E</div>
        <span class="logo-text">E-Meeting</span>
      </div>

      <h2 class="title">Welcome Back!</h2>
      <p class="subtitle">Please enter your username and password here!</p>

      <form id="loginForm">
        <div class="input-group">
          <input
            type="text"
            id="username"
            placeholder="Username"
            class="input-field"
            required
          />
        </div>
        <div class="input-group">
          <input
            type="password"
            id="password"
            placeholder="Password"
            class="input-field"
            required
          />
          <button type="button" id="togglePassword" class="password-toggle">
            <i class="fas fa-eye-slash"></i>
          </button>
        </div>
        <div style="margin-bottom: 24px">
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="login-button">Login</button>
      </form>
    </div>

    <!-- Skrip JavaScript -->
    <script>
      document
        .getElementById("togglePassword")
        .addEventListener("click", function () {
          const passwordInput = document.getElementById("password");
          const type =
            passwordInput.getAttribute("type") === "password"
              ? "text"
              : "password";
          passwordInput.setAttribute("type", type);
          this.querySelector("i").classList.toggle("fa-eye-slash");
          this.querySelector("i").classList.toggle("fa-eye");
        });

      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          // Di sini Anda dapat menambahkan logika untuk validasi dan pengiriman data login
          console.log("Username:", username);
          console.log("Password:", password);
          alert("Login berhasil (untuk demo).");
        });
    </script>
  </body>
</html>
